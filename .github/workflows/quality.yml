name: TheOct quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout theme
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: none
          coverage: none

      - name: Static content-schema and blank-frontend checks
        run: python tests/check_static.py

      - name: PHP syntax (theme and smoke tests)
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -name '*.php' -type f -print0)

      - name: CPT auto-registration regression tests (no plugin required)
        run: php tests/test-content-registration.php

      - name: JavaScript syntax
        run: |
          node --check assets/admin/cpt-editor.js
          node --check tests/e2e/cpt-admin.spec.js
